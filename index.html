<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBot</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }

      /* Scrollbar */
      #chatContainer::-webkit-scrollbar { width: 4px; }
      #chatContainer::-webkit-scrollbar-track { background: transparent; }
      #chatContainer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 99px; }

      /* Typing dots */
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40%            { transform: translateY(-6px); opacity: 1; }
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; display: inline-block; animation: bounce 1.2s infinite ease-in-out; }
      .dot:nth-child(2) { animation-delay: 0.15s; }
      .dot:nth-child(3) { animation-delay: 0.30s; }

      /* Fade-in for messages */
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .msg-anim { animation: fadeSlideIn 0.25s ease forwards; }

      /* Subtle gradient background */
      body { background: radial-gradient(ellipse at 20% 0%, #1a0a2e 0%, #09090b 55%); }

      /* Glow on textarea focus */
      #inputWrapper:focus-within {
        border-color: rgba(139,92,246,0.5);
        box-shadow: 0 0 0 3px rgba(139,92,246,0.12), 0 0 20px rgba(139,92,246,0.08);
      }

      /* Auto-resize textarea */
      #input { field-sizing: content; }
    </style>
  </head>

  <body class="w-full h-full text-white flex flex-col overflow-hidden">

    <!-- ───── Header ───── -->
    <header class="shrink-0 flex items-center justify-between px-6 py-3.5 border-b border-white/5 bg-zinc-950/70 backdrop-blur-xl">
      <div class="flex items-center gap-2.5">
        <!-- Logo mark -->
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center shadow-lg shadow-violet-900/40">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.03 2 11c0 2.87 1.37 5.44 3.53 7.18L4 22l4.26-1.42A10.3 10.3 0 0012 21c5.52 0 10-4.03 10-9S17.52 2 12 2zm1 13H7v-2h6v2zm3-4H7V9h9v2z"/>
          </svg>
        </div>
        <div>
          <span class="font-semibold text-sm text-white leading-none block">ChatBot</span>
          <span class="text-[10px] text-zinc-500 leading-none">powered by AI</span>
        </div>
      </div>
      <!-- Status -->
      <div class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/20 rounded-full px-3 py-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-[11px] text-emerald-400 font-medium">Online</span>
      </div>
    </header>

    <!-- ───── Chat Area ───── -->
    <div class="flex-1 overflow-y-auto px-4 py-6" id="chatContainer">
      <div class="max-w-2xl mx-auto flex flex-col gap-6" id="messageList">

        <!-- Welcome state -->
        <div id="welcomeState" class="flex flex-col items-center justify-center gap-4 mt-16 text-center px-4">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-500 to-purple-700 flex items-center justify-center shadow-2xl shadow-violet-900/50">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.03 2 11c0 2.87 1.37 5.44 3.53 7.18L4 22l4.26-1.42A10.3 10.3 0 0012 21c5.52 0 10-4.03 10-9S17.52 2 12 2zm1 13H7v-2h6v2zm3-4H7V9h9v2z"/>
            </svg>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-white mb-1">How can I help you?</h2>
            <p class="text-zinc-500 text-sm">Ask me anything — I'm here to assist.</p>
          </div>
          <!-- Suggestion chips -->
          <div class="flex flex-wrap justify-center gap-2 mt-2">
            <button class="suggestion-chip px-4 py-2 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 text-xs text-zinc-300 transition-all hover:border-violet-500/40">✨ What can you do?</button>
            <button class="suggestion-chip px-4 py-2 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 text-xs text-zinc-300 transition-all hover:border-violet-500/40">📝 Help me write something</button>
            <button class="suggestion-chip px-4 py-2 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 text-xs text-zinc-300 transition-all hover:border-violet-500/40">🔍 Explain a concept</button>
          </div>
        </div>

      </div>
    </div>

    <!-- ───── Input Bar ───── -->
    <div class="shrink-0 border-t border-white/5 bg-zinc-950/70 backdrop-blur-xl px-4 py-4">
      <div
        id="inputWrapper"
        class="max-w-2xl mx-auto bg-zinc-900/80 border border-white/8 rounded-2xl overflow-hidden transition-all duration-200"
      >
        <textarea
          id="input"
          class="w-full resize-none outline-none px-4 pt-4 pb-2 bg-transparent text-white text-sm placeholder-zinc-600 leading-relaxed max-h-40 overflow-y-auto"
          rows="1"
          placeholder="Send a message…"
        ></textarea>
        <div class="flex items-center justify-between px-3 pb-3 pt-1">
          <span class="text-[11px] text-zinc-600 select-none">Shift + Enter for new line</span>
          <button
            id="askButton"
            class="flex items-center gap-1.5 bg-violet-600 hover:bg-violet-500 active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed px-4 py-2 text-white rounded-xl cursor-pointer transition-all duration-150 text-xs font-semibold shadow-md shadow-violet-900/40"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            Send
          </button>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
